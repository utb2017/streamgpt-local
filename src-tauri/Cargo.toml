[package]
name = "streamgpt-local"
version = "0.2.3"
description = "A local LG webOS and Roku controller with MCP"
authors = ["Aaron Tomlinson"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "streamgpt_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots", "native-tls"] }
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
quick-xml = { version = "0.37", features = ["serialize"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
directories = "6"
axum = "0.8"
subtle = "2"
if-addrs = "0.13"
socket2 = "0.6"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
